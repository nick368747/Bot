name: Render Keep Awake Ping

on:
  schedule:
    # GitHub cron runs at minutes 0, 8, 16, 24, 32, 40, 48 and 56.
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-awake-ping
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        env:
          HEALTH_URL: https://bot-drgg.onrender.com/health
        run: |
          set -eu
          curl --fail --silent --show-error --max-time 30 "$HEALTH_URL"
          echo
          echo "Render health endpoint responded successfully."
